<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bully Council Game</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/game.js" defer></script>
</head>
<body>
  <main>
    <header class="top">
      <div>
        <h1>bully council game</h1>
        <p class="sub">A quiz about documented government actions.</p>
      </div>
      <div class="score">Timelord Points: <strong id="score">0</strong></div>
    </header>

    <section class="panel" id="game">
      <div class="status">
        <span id="round-label">Round 1</span>
        <span id="progress">Question 1 of 15</span>
      </div>

      <div class="agency" id="agency">CIA</div>
      <h2 id="question"></h2>
      <div id="choices"></div>

      <div id="feedback" aria-live="polite"></div>
      <button id="next" hidden>Next question</button>
    </section>

    <section class="panel" id="round-complete" hidden>
      <h2 id="complete-title">Round complete</h2>
      <p id="complete-text"></p>
      <button id="next-round">Start next round</button>
    </section>

    <section class="panel">
      <h2>Evidence board</h2>
      <p class="sub">
        Pins with the same topic are connected. A shared topic is not proof of
        a direct connection.
      </p>

      <div class="add-pin">
        <input id="pin-input" maxlength="180" placeholder="Add your own note">
        <select id="pin-topic" aria-label="Choose note topic">
          <option>Surveillance</option>
          <option>Covert action</option>
          <option>Political disruption</option>
          <option>Human research</option>
          <option>Records and oversight</option>
        </select>
        <button id="add-pin">Pin note</button>
      </div>

      <div id="board">
        <svg id="lines" aria-hidden="true"></svg>
        <div id="pins"></div>
      </div>
      <button id="clear-board" class="quiet-button">Clear board</button>
      <p class="sub small">Board notes are saved in this browser.</p>
    </section>
  </main>
</body>
</html>
